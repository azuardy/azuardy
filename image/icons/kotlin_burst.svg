<svg xmlns="http://www.w3.org/2000/svg" width="68" height="68" viewBox="-40 -40 336 336" fill="none" overflow="visible">
  <defs>
    <filter id="burst-glow-kotlin" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="rgba(127, 82, 255, 0.8)" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <radialGradient id="blast-grad-kotlin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="rgba(127, 82, 255, 0.8)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style><![CDATA[
    /* Explosive Flying Shards (plays once on load) */
    @keyframes shard_tl {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translate(-80px, -80px) rotate(-60deg) scale(0.3); opacity: 0; }
    }
    @keyframes shard_tr {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translate(80px, -80px) rotate(60deg) scale(0.3); opacity: 0; }
    }
    @keyframes shard_bl {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translate(-80px, 80px) rotate(-50deg) scale(0.3); opacity: 0; }
    }
    @keyframes shard_br {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translate(80px, 80px) rotate(50deg) scale(0.3); opacity: 0; }
    }

    /* Shockwave blast circle */
    @keyframes blast_ring {
      0% { transform: scale(0.1); opacity: 1; }
      70% { transform: scale(1.9); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* Icon Pop & Float */
    @keyframes icon_pop {
      0% { transform: scale(0) rotate(-25deg); opacity: 0; }
      55% { transform: scale(1.25) rotate(4deg); opacity: 1; }
      80% { transform: scale(0.96) rotate(-2deg); opacity: 1; }
      100% { transform: scale(1.0) rotate(0deg); opacity: 1; }
    }
    @keyframes icon_idle_float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-4px) rotate(1.2deg); }
      50% { transform: translateY(-9px) rotate(0deg); }
      75% { transform: translateY(-4px) rotate(-1.2deg); }
    }

    .sh-tl { animation: shard_tl 0.55s ease-out forwards; transform-origin: 64px 64px; }
    .sh-tr { animation: shard_tr 0.55s ease-out forwards; transform-origin: 192px 64px; }
    .sh-bl { animation: shard_bl 0.55s ease-out forwards; transform-origin: 64px 192px; }
    .sh-br { animation: shard_br 0.55s ease-out forwards; transform-origin: 192px 192px; }

    .blast-circle {
      animation: blast_ring 0.5s ease-out forwards;
      transform-origin: 128px 128px;
    }

    .pop-container {
      animation: icon_pop 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      transform-origin: 128px 128px;
    }

    .float-container {
      animation: icon_idle_float 3.5s ease-in-out infinite;
      animation-delay: 0.65s;
      transform-origin: 128px 128px;
      filter: url(#burst-glow-kotlin);
    }
  ]]></style>

  <!-- SHOCKWAVE ENERGY BURST -->
  <circle class="blast-circle" cx="128" cy="128" r="85" fill="url(#blast-grad-kotlin)"/>

  <!-- SHATTERING BOX SHARDS (Flys out in 0.5s) -->
  <g>
    <path class="sh-tl" d="M12 12 H128 L108 128 L12 96 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="4"/>
    <path class="sh-tr" d="M128 12 H244 L244 108 L138 128 Z" fill="#0F172A" stroke="#818CF8" stroke-width="4"/>
    <path class="sh-bl" d="M12 96 L108 128 L128 244 H12 Z" fill="#0F172A" stroke="#818CF8" stroke-width="4"/>
    <path class="sh-br" d="M138 128 L244 108 L244 244 H128 Z" fill="#020617" stroke="#C084FC" stroke-width="4"/>
  </g>

  <!-- REVEALED ICON (POPS THEN FLOATS FOREVER) -->
  <g class="pop-container">
    <g class="float-container">
            <rect xmlns="http://www.w3.org/2000/svg" x="12" y="12" width="232" height="232" rx="56" fill="url(#box-grad-kotlin)" stroke="url(#border-grad-kotlin)" stroke-width="6" />

    
    
            <path xmlns="http://www.w3.org/2000/svg" class="shard-tl" d="M12 12 H128 L110 128 L12 100 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="4" />
    
    
            <path xmlns="http://www.w3.org/2000/svg" class="shard-tr" d="M128 12 H244 L244 110 L140 128 Z" fill="#0F172A" stroke="#818CF8" stroke-width="4" />
    
    
            <path xmlns="http://www.w3.org/2000/svg" class="shard-bl" d="M12 100 L110 128 L128 244 H12 Z" fill="#0F172A" stroke="#818CF8" stroke-width="4" />
    
    
            <path xmlns="http://www.w3.org/2000/svg" class="shard-br" d="M140 128 L244 110 L244 244 H128 Z" fill="#020617" stroke="#C084FC" stroke-width="4" />
  
            <rect xmlns="http://www.w3.org/2000/svg" width="256" height="256" rx="60" fill="#242938" />

        
            <path xmlns="http://www.w3.org/2000/svg" d="M218 218H38V38H218L128 128L218 218Z" fill="url(#paint0_linear_7_120)" />

        
    </g>
  </g>
</svg>