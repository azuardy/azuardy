<svg xmlns="http://www.w3.org/2000/svg" width="68" height="68" viewBox="-40 -40 336 336" fill="none" overflow="visible">
  <defs>
    <!-- Glow filter for mystery box -->
    <filter id="box-glow-dart" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.6)"/>
    </filter>

    <!-- Glow filter for revealed icon -->
    <filter id="icon-glow-dart" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="rgba(0, 180, 171, 0.75)" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="rgba(0,0,0,0.5)"/>
    </filter>

    <!-- Mystery Box Gradient -->
    <linearGradient id="box-grad-dart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Golden/Cyan Accent Border Gradient -->
    <linearGradient id="border-grad-dart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Burst Energy Gradient -->
    <radialGradient id="energy-burst-dart" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="rgba(0, 180, 171, 0.75)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style><![CDATA[
    /* Box Rumble and Dissolve Animation */
    @keyframes box_anim_dart {
      0%, 15% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0deg);
      }
      18% {
        transform: translateY(-2px) scale(1.02) rotate(-2deg);
      }
      21% {
        transform: translateY(2px) scale(1.02) rotate(2deg);
      }
      24% {
        transform: translateY(-4px) scale(1.04) rotate(-3deg);
      }
      27% {
        transform: translateY(4px) scale(1.06) rotate(3deg);
      }
      29% {
        transform: translateY(-2px) scale(1.08) rotate(-1deg);
      }
      31% {
        transform: scale(1.12);
        opacity: 1;
      }
      33% {
        /* Explodes away */
        transform: scale(1.25);
        opacity: 0;
      }
      86% {
        opacity: 0;
        transform: scale(0.6);
      }
      91%, 100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    /* Question mark pulsing */
    @keyframes q_pulse_dart {
      0%, 15% {
        transform: scale(1);
        filter: drop-shadow(0 0 6px #38BDF8);
      }
      20%, 30% {
        transform: scale(1.15);
        filter: drop-shadow(0 0 16px #38BDF8) drop-shadow(0 0 25px #C084FC);
      }
      33% {
        transform: scale(1.3);
        opacity: 0;
      }
      90% {
        opacity: 0;
      }
      95%, 100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Shard 1 (Top-Left) */
    @keyframes shard_tl_dart {
      0%, 31% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0;
      }
      32% {
        opacity: 1;
      }
      38% {
        transform: translate(-65px, -65px) rotate(-45deg) scale(0.7);
        opacity: 0;
      }
      100% {
        transform: translate(-65px, -65px) rotate(-45deg) scale(0.7);
        opacity: 0;
      }
    }

    /* Shard 2 (Top-Right) */
    @keyframes shard_tr_dart {
      0%, 31% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0;
      }
      32% {
        opacity: 1;
      }
      38% {
        transform: translate(65px, -65px) rotate(45deg) scale(0.7);
        opacity: 0;
      }
      100% {
        transform: translate(65px, -65px) rotate(45deg) scale(0.7);
        opacity: 0;
      }
    }

    /* Shard 3 (Bottom-Left) */
    @keyframes shard_bl_dart {
      0%, 31% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0;
      }
      32% {
        opacity: 1;
      }
      38% {
        transform: translate(-65px, 65px) rotate(-35deg) scale(0.7);
        opacity: 0;
      }
      100% {
        transform: translate(-65px, 65px) rotate(-35deg) scale(0.7);
        opacity: 0;
      }
    }

    /* Shard 4 (Bottom-Right) */
    @keyframes shard_br_dart {
      0%, 31% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0;
      }
      32% {
        opacity: 1;
      }
      38% {
        transform: translate(65px, 65px) rotate(35deg) scale(0.7);
        opacity: 0;
      }
      100% {
        transform: translate(65px, 65px) rotate(35deg) scale(0.7);
        opacity: 0;
      }
    }

    /* Blast wave circle */
    @keyframes blast_wave_dart {
      0%, 31% {
        transform: scale(0);
        opacity: 0;
      }
      32% {
        opacity: 1;
        transform: scale(0.2);
      }
      38% {
        transform: scale(1.8);
        opacity: 0;
      }
      100% {
        transform: scale(1.8);
        opacity: 0;
      }
    }

    /* Revealed Icon Burst & Floating */
    @keyframes icon_reveal_dart {
      0%, 31% {
        transform: scale(0) rotate(-15deg);
        opacity: 0;
      }
      34% {
        /* Explosive Overshoot */
        transform: scale(1.22) rotate(3deg);
        opacity: 1;
      }
      38% {
        transform: scale(0.96) rotate(-1deg);
        opacity: 1;
      }
      42% {
        transform: scale(1.0) translateY(0px) rotate(0deg);
        opacity: 1;
      }
      60% {
        /* Gentle float up */
        transform: translateY(-8px) scale(1.02);
        opacity: 1;
      }
      78% {
        /* Gentle float down */
        transform: translateY(0px) scale(1.0);
        opacity: 1;
      }
      85% {
        opacity: 1;
        transform: scale(1.0);
      }
      89% {
        /* Shrinks back to box */
        opacity: 0;
        transform: scale(0.4) rotate(10deg);
      }
      100% {
        opacity: 0;
        transform: scale(0);
      }
    }

    .box-group {
      animation: box_anim_dart 6.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 0.4s;
      transform-origin: 128px 128px;
    }
    .question-mark {
      animation: q_pulse_dart 6.5s ease-in-out infinite;
      animation-delay: 0.4s;
      transform-origin: 128px 128px;
    }
    .shard-tl {
      animation: shard_tl_dart 6.5s ease-out infinite;
      animation-delay: 0.4s;
      transform-origin: 64px 64px;
    }
    .shard-tr {
      animation: shard_tr_dart 6.5s ease-out infinite;
      animation-delay: 0.4s;
      transform-origin: 192px 64px;
    }
    .shard-bl {
      animation: shard_bl_dart 6.5s ease-out infinite;
      animation-delay: 0.4s;
      transform-origin: 64px 192px;
    }
    .shard-br {
      animation: shard_br_dart 6.5s ease-out infinite;
      animation-delay: 0.4s;
      transform-origin: 192px 192px;
    }
    .blast-circle {
      animation: blast_wave_dart 6.5s ease-out infinite;
      animation-delay: 0.4s;
      transform-origin: 128px 128px;
    }
    .icon-reveal-group {
      animation: icon_reveal_dart 6.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite;
      animation-delay: 0.4s;
      transform-origin: 128px 128px;
      filter: url(#icon-glow-dart);
    }
  ]]></style>

  <!-- BLAST SHOCKWAVE CIRCLE -->
  <circle class="blast-circle" cx="128" cy="128" r="90" fill="url(#energy-burst-dart)"/>

  <!-- MYSTERY BOX GROUP -->
  <g class="box-group" filter="url(#box-glow-dart)">
    <!-- Box Body -->
    <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#box-grad-dart)" stroke="url(#border-grad-dart)" stroke-width="6"/>

    <!-- Cyber / Lucky Block Corner Rivets -->
    <circle cx="48" cy="48" r="8" fill="#38BDF8" opacity="0.8"/>
    <circle cx="208" cy="48" r="8" fill="#818CF8" opacity="0.8"/>
    <circle cx="48" cy="208" r="8" fill="#818CF8" opacity="0.8"/>
    <circle cx="208" cy="208" r="8" fill="#C084FC" opacity="0.8"/>

    <!-- Stylized Question Mark "?" -->
    <g class="question-mark">
      <text x="128" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="135" font-weight="900" fill="#38BDF8" text-anchor="middle">?</text>
    </g>
  </g>

  <!-- SHATTERS / FLYING SHARDS -->
  <g>
    <!-- Shard TL -->
    <path class="shard-tl" d="M12 12 H128 L110 128 L12 100 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="4"/>
    <!-- Shard TR -->
    <path class="shard-tr" d="M128 12 H244 L244 110 L140 128 Z" fill="#0F172A" stroke="#818CF8" stroke-width="4"/>
    <!-- Shard BL -->
    <path class="shard-bl" d="M12 100 L110 128 L128 244 H12 Z" fill="#0F172A" stroke="#818CF8" stroke-width="4"/>
    <!-- Shard BR -->
    <path class="shard-br" d="M140 128 L244 110 L244 244 H128 Z" fill="#020617" stroke="#C084FC" stroke-width="4"/>
  </g>

  <!-- REVEALED ICON LAYER -->
  <g class="icon-reveal-group">
        <rect xmlns="http://www.w3.org/2000/svg" width="256" height="256" fill="#242938" rx="60" />
        <path xmlns="http://www.w3.org/2000/svg" fill="#00C4B3" d="M87.4494 87.005L75.8113 75.3612L75.8563 159.463L75.9969 163.39C76.0532 165.246 76.4047 167.327 76.9672 169.493L169.147 202.005L192.209 191.796L192.229 191.762L87.4438 87.005H87.4494Z" />
        <path xmlns="http://www.w3.org/2000/svg" fill="#22D3C5" d="M76.97 169.493H76.9785C76.97 169.459 76.956 169.42 76.9391 169.38C76.9588 169.423 76.9588 169.465 76.9672 169.493H76.97ZM192.187 191.796L169.124 202.005L76.9588 169.493C78.7166 176.254 82.6175 183.853 86.8081 187.999L116.874 217.916L183.778 218L192.159 191.796H192.187Z" />
        <path xmlns="http://www.w3.org/2000/svg" fill="#0075C9" d="M76.1263 75.364L40.2866 129.491C37.311 132.669 38.796 139.227 43.5856 144.059L64.2744 164.917L77.2794 169.501C76.7169 167.341 76.3625 165.282 76.3091 163.398L76.1685 159.472L76.1263 75.3696V75.364Z" />
        <path xmlns="http://www.w3.org/2000/svg" fill="#0075C9" d="M169.906 76.4469C167.741 75.8984 165.665 75.5525 163.795 75.499L159.638 75.3472L75.8113 75.3669L192.226 191.765L202.453 168.702L169.912 76.4525L169.906 76.4469Z" />
        <path xmlns="http://www.w3.org/2000/svg" fill="#00A8E1" d="M169.799 76.4271C169.836 76.4412 169.875 76.4496 169.906 76.4553V76.444C169.87 76.4356 169.836 76.4356 169.799 76.4215V76.4271ZM188.404 86.3215C184.171 82.0606 176.676 78.1653 169.906 76.4553L202.447 168.697L192.209 191.759L217.19 183.777L217.246 115.287L188.401 86.3187L188.404 86.3215Z" />
        <path xmlns="http://www.w3.org/2000/svg" fill="#00C4B3" d="M165.344 63.5234L144.532 42.8234C139.677 38.0506 133.119 36.56 129.969 39.53L75.845 75.3613L159.672 75.3416L163.828 75.4934C165.699 75.5497 167.777 75.8928 169.94 76.4413L165.35 63.5178L165.344 63.5234Z" />
  </g>
</svg>