<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 -35 256 326" fill="none" overflow="visible">
  <defs>
    <filter id="glow-flutter" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="rgba(66, 165, 245, 0.65)" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0, 0, 0, 0.45)"/>
    </filter>
  </defs>
  <style>
    @keyframes float_flutter {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      25% {
        transform: translateY(-5px) rotate(1.2deg);
      }
      50% {
        transform: translateY(-11px) rotate(0deg);
      }
      75% {
        transform: translateY(-5px) rotate(-1.2deg);
      }
    }
    .animated-badge {
      animation: float_flutter 3.4s ease-in-out infinite;
      animation-delay: 0.0s;
      transform-origin: 128px 128px;
      filter: url(#glow-flutter);
    }
  </style>
  <g class="animated-badge">
    <g xmlns="http://www.w3.org/2000/svg" transform="translate(0, 0)">
