<svg xmlns="http://www.w3.org/2000/svg" width="68" height="68" viewBox="-40 -40 336 336" fill="none" overflow="visible">
  <defs>
    <!-- Glow filter for mystery box -->
    <filter id="box-glow-js" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.6)"/>
    </filter>

    <!-- Glow filter for revealed icon -->
    <filter id="icon-glow-js" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="rgba(247, 223, 30, 0.75)" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="rgba(0,0,0,0.5)"/>
    </filter>

    <!-- Mystery Box Gradient -->
    <linearGradient id="box-grad-js" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Golden/Cyan Accent Border Gradient -->
    <linearGradient id="border-grad-js" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Burst Energy Gradient -->
    <radialGradient id="energy-burst-js" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="rgba(247, 223, 30, 0.75)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style><![CDATA[
    /* Box Rumble and Dissolve Animation */
    @keyframes box_anim_js {
      0%, 15% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0deg);
      }
      18% {
        transform: translateY(-2px) scale(1.02) rotate(-2deg);
      }
      21% {
        transform: translateY(2px) scale(1.02) rotate(2deg);
      }
      24% {
        transform: translateY(-4px) scale(1.04) rotate(-3deg);
      }
      27% {
        transform: translateY(4px) scale(1.06) rotate(3deg);
      }
      29% {
        transform: translateY(-2px) scale(1.08) rotate(-1deg);
      }
      31% {
        transform: scale(1.12);
        opacity: 1;
      }
      33% {
        /* Explodes away */
        transform: scale(1.25);
        opacity: 0;
      }
      86% {
        opacity: 0;
        transform: scale(0.6);
      }
      91%, 100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    /* Question mark pulsing */
    @keyframes q_pulse_js {
      0%, 15% {
        transform: scale(1);
        filter: drop-shadow(0 0 6px #38BDF8);
      }
      20%, 30% {
        transform: scale(1.15);
        filter: drop-shadow(0 0 16px #38BDF8) drop-shadow(0 0 25px #C084FC);
      }
      33% {
        transform: scale(1.3);
        opacity: 0;
      }
      90% {
        opacity: 0;
      }
      95%, 100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Shard 1 (Top-Left) */
    @keyframes shard_tl_js {
      0%, 31% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0;
      }
      32% {
        opacity: 1;
      }
      38% {
        transform: translate(-65px, -65px) rotate(-45deg) scale(0.7);
        opacity: 0;
      }
      100% {
        transform: translate(-65px, -65px) rotate(-45deg) scale(0.7);
        opacity: 0;
      }
    }

    /* Shard 2 (Top-Right) */
    @keyframes shard_tr_js {
      0%, 31% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0;
      }
      32% {
        opacity: 1;
      }
      38% {
        transform: translate(65px, -65px) rotate(45deg) scale(0.7);
        opacity: 0;
      }
      100% {
        transform: translate(65px, -65px) rotate(45deg) scale(0.7);
        opacity: 0;
      }
    }

    /* Shard 3 (Bottom-Left) */
    @keyframes shard_bl_js {
      0%, 31% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0;
      }
      32% {
        opacity: 1;
      }
      38% {
        transform: translate(-65px, 65px) rotate(-35deg) scale(0.7);
        opacity: 0;
      }
      100% {
        transform: translate(-65px, 65px) rotate(-35deg) scale(0.7);
        opacity: 0;
      }
    }

    /* Shard 4 (Bottom-Right) */
    @keyframes shard_br_js {
      0%, 31% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0;
      }
      32% {
        opacity: 1;
      }
      38% {
        transform: translate(65px, 65px) rotate(35deg) scale(0.7);
        opacity: 0;
      }
      100% {
        transform: translate(65px, 65px) rotate(35deg) scale(0.7);
        opacity: 0;
      }
    }

    /* Blast wave circle */
    @keyframes blast_wave_js {
      0%, 31% {
        transform: scale(0);
        opacity: 0;
      }
      32% {
        opacity: 1;
        transform: scale(0.2);
      }
      38% {
        transform: scale(1.8);
        opacity: 0;
      }
      100% {
        transform: scale(1.8);
        opacity: 0;
      }
    }

    /* Revealed Icon Burst & Floating */
    @keyframes icon_reveal_js {
      0%, 31% {
        transform: scale(0) rotate(-15deg);
        opacity: 0;
      }
      34% {
        /* Explosive Overshoot */
        transform: scale(1.22) rotate(3deg);
        opacity: 1;
      }
      38% {
        transform: scale(0.96) rotate(-1deg);
        opacity: 1;
      }
      42% {
        transform: scale(1.0) translateY(0px) rotate(0deg);
        opacity: 1;
      }
      60% {
        /* Gentle float up */
        transform: translateY(-8px) scale(1.02);
        opacity: 1;
      }
      78% {
        /* Gentle float down */
        transform: translateY(0px) scale(1.0);
        opacity: 1;
      }
      85% {
        opacity: 1;
        transform: scale(1.0);
      }
      89% {
        /* Shrinks back to box */
        opacity: 0;
        transform: scale(0.4) rotate(10deg);
      }
      100% {
        opacity: 0;
        transform: scale(0);
      }
    }

    .box-group {
      animation: box_anim_js 6.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 0.8s;
      transform-origin: 128px 128px;
    }
    .question-mark {
      animation: q_pulse_js 6.5s ease-in-out infinite;
      animation-delay: 0.8s;
      transform-origin: 128px 128px;
    }
    .shard-tl {
      animation: shard_tl_js 6.5s ease-out infinite;
      animation-delay: 0.8s;
      transform-origin: 64px 64px;
    }
    .shard-tr {
      animation: shard_tr_js 6.5s ease-out infinite;
      animation-delay: 0.8s;
      transform-origin: 192px 64px;
    }
    .shard-bl {
      animation: shard_bl_js 6.5s ease-out infinite;
      animation-delay: 0.8s;
      transform-origin: 64px 192px;
    }
    .shard-br {
      animation: shard_br_js 6.5s ease-out infinite;
      animation-delay: 0.8s;
      transform-origin: 192px 192px;
    }
    .blast-circle {
      animation: blast_wave_js 6.5s ease-out infinite;
      animation-delay: 0.8s;
      transform-origin: 128px 128px;
    }
    .icon-reveal-group {
      animation: icon_reveal_js 6.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite;
      animation-delay: 0.8s;
      transform-origin: 128px 128px;
      filter: url(#icon-glow-js);
    }
  ]]></style>

  <!-- BLAST SHOCKWAVE CIRCLE -->
  <circle class="blast-circle" cx="128" cy="128" r="90" fill="url(#energy-burst-js)"/>

  <!-- MYSTERY BOX GROUP -->
  <g class="box-group" filter="url(#box-glow-js)">
    <!-- Box Body -->
    <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#box-grad-js)" stroke="url(#border-grad-js)" stroke-width="6"/>

    <!-- Cyber / Lucky Block Corner Rivets -->
    <circle cx="48" cy="48" r="8" fill="#38BDF8" opacity="0.8"/>
    <circle cx="208" cy="48" r="8" fill="#818CF8" opacity="0.8"/>
    <circle cx="48" cy="208" r="8" fill="#818CF8" opacity="0.8"/>
    <circle cx="208" cy="208" r="8" fill="#C084FC" opacity="0.8"/>

    <!-- Stylized Question Mark "?" -->
    <g class="question-mark">
      <text x="128" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="135" font-weight="900" fill="#38BDF8" text-anchor="middle">?</text>
    </g>
  </g>

  <!-- SHATTERS / FLYING SHARDS -->
  <g>
    <!-- Shard TL -->
    <path class="shard-tl" d="M12 12 H128 L110 128 L12 100 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="4"/>
    <!-- Shard TR -->
    <path class="shard-tr" d="M128 12 H244 L244 110 L140 128 Z" fill="#0F172A" stroke="#818CF8" stroke-width="4"/>
    <!-- Shard BL -->
    <path class="shard-bl" d="M12 100 L110 128 L128 244 H12 Z" fill="#0F172A" stroke="#818CF8" stroke-width="4"/>
    <!-- Shard BR -->
    <path class="shard-br" d="M140 128 L244 110 L244 244 H128 Z" fill="#020617" stroke="#C084FC" stroke-width="4"/>
  </g>

  <!-- REVEALED ICON LAYER -->
  <g class="icon-reveal-group">
        <rect xmlns="http://www.w3.org/2000/svg" width="256" height="256" rx="60" fill="#F0DB4F" />

        <path xmlns="http://www.w3.org/2000/svg" d="M67.3117 213.932L86.9027 202.076C90.6821 208.777 94.1202 214.447 102.367 214.447C110.272 214.447 115.256 211.355 115.256 199.327V117.529H139.314V199.667C139.314 224.584 124.708 235.926 103.398 235.926C84.1533 235.926 72.9819 225.959 67.3113 213.93" fill="#323330" />

        <path xmlns="http://www.w3.org/2000/svg" d="M152.381 211.354L171.969 200.013C177.126 208.434 183.828 214.62 195.684 214.62C205.653 214.62 212.009 209.636 212.009 202.762C212.009 194.514 205.479 191.592 194.481 186.782L188.468 184.203C171.111 176.815 159.597 167.535 159.597 147.945C159.597 129.901 173.345 116.153 194.826 116.153C210.12 116.153 221.118 121.481 229.022 135.4L210.291 147.429C206.166 140.04 201.7 137.119 194.826 137.119C187.78 137.119 183.312 141.587 183.312 147.429C183.312 154.646 187.78 157.568 198.09 162.037L204.104 164.614C224.553 173.379 236.067 182.313 236.067 202.418C236.067 224.072 219.055 235.928 196.2 235.928C173.861 235.928 159.426 225.274 152.381 211.354" fill="#323330" />

  </g>
</svg>