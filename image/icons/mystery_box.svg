<svg xmlns="http://www.w3.org/2000/svg" width="68" height="68" viewBox="-30 -30 316 316" fill="none" overflow="visible">
  <defs>
    <filter id="box-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#38BDF8" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
  <style><![CDATA[
    @keyframes box_float {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      25% {
        transform: translateY(-4px) rotate(1.5deg);
      }
      50% {
        transform: translateY(-8px) rotate(0deg);
      }
      75% {
        transform: translateY(-4px) rotate(-1.5deg);
      }
    }
    @keyframes q_pulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 6px #38BDF8);
      }
      50% {
        transform: scale(1.12);
        filter: drop-shadow(0 0 16px #38BDF8) drop-shadow(0 0 24px #C084FC);
      }
    }
    .box-container {
      animation: box_float 3.5s ease-in-out infinite;
      transform-origin: 128px 128px;
      filter: url(#box-glow);
      cursor: pointer;
    }
    .question-mark {
      animation: q_pulse 2.2s ease-in-out infinite;
      transform-origin: 128px 128px;
    }
  ]]></style>
  <g class="box-container">
    <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#box-grad)" stroke="url(#border-grad)" stroke-width="6"/>
    <circle cx="48" cy="48" r="8" fill="#38BDF8" opacity="0.85"/>
    <circle cx="208" cy="48" r="8" fill="#818CF8" opacity="0.85"/>
    <circle cx="48" cy="208" r="8" fill="#818CF8" opacity="0.85"/>
    <circle cx="208" cy="208" r="8" fill="#C084FC" opacity="0.85"/>
    <g class="question-mark">
      <text x="128" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="135" font-weight="900" fill="#38BDF8" text-anchor="middle">?</text>
    </g>
  </g>
</svg>