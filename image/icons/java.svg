<svg xmlns="http://www.w3.org/2000/svg" width="68" height="68" viewBox="-40 -40 336 336" fill="none" overflow="visible">
  <defs>
    <!-- Glow filter for mystery box -->
    <filter id="box-glow-java" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.6)"/>
    </filter>

    <!-- Glow filter for revealed icon -->
    <filter id="icon-glow-java" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="rgba(237, 139, 0, 0.75)" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="rgba(0,0,0,0.5)"/>
    </filter>

    <!-- Mystery Box Gradient -->
    <linearGradient id="box-grad-java" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Golden/Cyan Accent Border Gradient -->
    <linearGradient id="border-grad-java" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Burst Energy Gradient -->
    <radialGradient id="energy-burst-java" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="rgba(237, 139, 0, 0.75)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style><![CDATA[
    /* Box Rumble and Dissolve Animation */
    @keyframes box_anim_java {
      0%, 15% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0deg);
      }
      18% {
        transform: translateY(-2px) scale(1.02) rotate(-2deg);
      }
      21% {
        transform: translateY(2px) scale(1.02) rotate(2deg);
      }
      24% {
        transform: translateY(-4px) scale(1.04) rotate(-3deg);
      }
      27% {
        transform: translateY(4px) scale(1.06) rotate(3deg);
      }
      29% {
        transform: translateY(-2px) scale(1.08) rotate(-1deg);
      }
      31% {
        transform: scale(1.12);
        opacity: 1;
      }
      33% {
        /* Explodes away */
        transform: scale(1.25);
        opacity: 0;
      }
      86% {
        opacity: 0;
        transform: scale(0.6);
      }
      91%, 100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    /* Question mark pulsing */
    @keyframes q_pulse_java {
      0%, 15% {
        transform: scale(1);
        filter: drop-shadow(0 0 6px #38BDF8);
      }
      20%, 30% {
        transform: scale(1.15);
        filter: drop-shadow(0 0 16px #38BDF8) drop-shadow(0 0 25px #C084FC);
      }
      33% {
        transform: scale(1.3);
        opacity: 0;
      }
      90% {
        opacity: 0;
      }
      95%, 100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Shard 1 (Top-Left) */
    @keyframes shard_tl_java {
      0%, 31% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0;
      }
      32% {
        opacity: 1;
      }
      38% {
        transform: translate(-65px, -65px) rotate(-45deg) scale(0.7);
        opacity: 0;
      }
      100% {
        transform: translate(-65px, -65px) rotate(-45deg) scale(0.7);
        opacity: 0;
      }
    }

    /* Shard 2 (Top-Right) */
    @keyframes shard_tr_java {
      0%, 31% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0;
      }
      32% {
        opacity: 1;
      }
      38% {
        transform: translate(65px, -65px) rotate(45deg) scale(0.7);
        opacity: 0;
      }
      100% {
        transform: translate(65px, -65px) rotate(45deg) scale(0.7);
        opacity: 0;
      }
    }

    /* Shard 3 (Bottom-Left) */
    @keyframes shard_bl_java {
      0%, 31% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0;
      }
      32% {
        opacity: 1;
      }
      38% {
        transform: translate(-65px, 65px) rotate(-35deg) scale(0.7);
        opacity: 0;
      }
      100% {
        transform: translate(-65px, 65px) rotate(-35deg) scale(0.7);
        opacity: 0;
      }
    }

    /* Shard 4 (Bottom-Right) */
    @keyframes shard_br_java {
      0%, 31% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0;
      }
      32% {
        opacity: 1;
      }
      38% {
        transform: translate(65px, 65px) rotate(35deg) scale(0.7);
        opacity: 0;
      }
      100% {
        transform: translate(65px, 65px) rotate(35deg) scale(0.7);
        opacity: 0;
      }
    }

    /* Blast wave circle */
    @keyframes blast_wave_java {
      0%, 31% {
        transform: scale(0);
        opacity: 0;
      }
      32% {
        opacity: 1;
        transform: scale(0.2);
      }
      38% {
        transform: scale(1.8);
        opacity: 0;
      }
      100% {
        transform: scale(1.8);
        opacity: 0;
      }
    }

    /* Revealed Icon Burst & Floating */
    @keyframes icon_reveal_java {
      0%, 31% {
        transform: scale(0) rotate(-15deg);
        opacity: 0;
      }
      34% {
        /* Explosive Overshoot */
        transform: scale(1.22) rotate(3deg);
        opacity: 1;
      }
      38% {
        transform: scale(0.96) rotate(-1deg);
        opacity: 1;
      }
      42% {
        transform: scale(1.0) translateY(0px) rotate(0deg);
        opacity: 1;
      }
      60% {
        /* Gentle float up */
        transform: translateY(-8px) scale(1.02);
        opacity: 1;
      }
      78% {
        /* Gentle float down */
        transform: translateY(0px) scale(1.0);
        opacity: 1;
      }
      85% {
        opacity: 1;
        transform: scale(1.0);
      }
      89% {
        /* Shrinks back to box */
        opacity: 0;
        transform: scale(0.4) rotate(10deg);
      }
      100% {
        opacity: 0;
        transform: scale(0);
      }
    }

    .box-group {
      animation: box_anim_java 6.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 1.6s;
      transform-origin: 128px 128px;
    }
    .question-mark {
      animation: q_pulse_java 6.5s ease-in-out infinite;
      animation-delay: 1.6s;
      transform-origin: 128px 128px;
    }
    .shard-tl {
      animation: shard_tl_java 6.5s ease-out infinite;
      animation-delay: 1.6s;
      transform-origin: 64px 64px;
    }
    .shard-tr {
      animation: shard_tr_java 6.5s ease-out infinite;
      animation-delay: 1.6s;
      transform-origin: 192px 64px;
    }
    .shard-bl {
      animation: shard_bl_java 6.5s ease-out infinite;
      animation-delay: 1.6s;
      transform-origin: 64px 192px;
    }
    .shard-br {
      animation: shard_br_java 6.5s ease-out infinite;
      animation-delay: 1.6s;
      transform-origin: 192px 192px;
    }
    .blast-circle {
      animation: blast_wave_java 6.5s ease-out infinite;
      animation-delay: 1.6s;
      transform-origin: 128px 128px;
    }
    .icon-reveal-group {
      animation: icon_reveal_java 6.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite;
      animation-delay: 1.6s;
      transform-origin: 128px 128px;
      filter: url(#icon-glow-java);
    }
  ]]></style>

  <!-- BLAST SHOCKWAVE CIRCLE -->
  <circle class="blast-circle" cx="128" cy="128" r="90" fill="url(#energy-burst-java)"/>

  <!-- MYSTERY BOX GROUP -->
  <g class="box-group" filter="url(#box-glow-java)">
    <!-- Box Body -->
    <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#box-grad-java)" stroke="url(#border-grad-java)" stroke-width="6"/>

    <!-- Cyber / Lucky Block Corner Rivets -->
    <circle cx="48" cy="48" r="8" fill="#38BDF8" opacity="0.8"/>
    <circle cx="208" cy="48" r="8" fill="#818CF8" opacity="0.8"/>
    <circle cx="48" cy="208" r="8" fill="#818CF8" opacity="0.8"/>
    <circle cx="208" cy="208" r="8" fill="#C084FC" opacity="0.8"/>

    <!-- Stylized Question Mark "?" -->
    <g class="question-mark">
      <text x="128" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="135" font-weight="900" fill="#38BDF8" text-anchor="middle">?</text>
    </g>
  </g>

  <!-- SHATTERS / FLYING SHARDS -->
  <g>
    <!-- Shard TL -->
    <path class="shard-tl" d="M12 12 H128 L110 128 L12 100 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="4"/>
    <!-- Shard TR -->
    <path class="shard-tr" d="M128 12 H244 L244 110 L140 128 Z" fill="#0F172A" stroke="#818CF8" stroke-width="4"/>
    <!-- Shard BL -->
    <path class="shard-bl" d="M12 100 L110 128 L128 244 H12 Z" fill="#0F172A" stroke="#818CF8" stroke-width="4"/>
    <!-- Shard BR -->
    <path class="shard-br" d="M140 128 L244 110 L244 244 H128 Z" fill="#020617" stroke="#C084FC" stroke-width="4"/>
  </g>

  <!-- REVEALED ICON LAYER -->
  <g class="icon-reveal-group">
        <rect xmlns="http://www.w3.org/2000/svg" width="256" height="256" fill="#242938" rx="60" />
        <path xmlns="http://www.w3.org/2000/svg" fill="#fff" d="M101.634 182.619C101.634 182.619 93.9548 187.293 106.979 188.63C122.707 190.634 131.023 190.299 148.386 186.962C148.386 186.962 153.06 189.971 159.406 192.306C120.331 209.002 70.9089 191.304 101.634 182.619ZM96.6252 160.914C96.6252 160.914 88.2753 167.26 101.299 168.593C118.327 170.262 131.69 170.597 154.732 165.926C154.732 165.926 157.741 169.267 162.747 170.936C115.664 184.961 62.8975 172.269 96.6252 160.917V160.914ZM188.795 198.984C188.795 198.984 194.471 203.658 182.449 207.334C160.073 214.012 88.6104 216.019 68.5735 207.334C61.564 204.325 74.9197 199.982 79.2587 199.319C83.6012 198.317 85.9366 198.317 85.9366 198.317C78.2569 192.973 34.8424 209.337 63.8959 214.046C143.709 227.073 209.499 208.37 188.792 199.018L188.795 198.984ZM105.307 138.203C105.307 138.203 68.9052 146.888 92.2793 149.89C102.298 151.223 122 150.892 140.368 149.555C155.396 148.221 170.458 145.548 170.458 145.548C170.458 145.548 165.113 147.886 161.441 150.222C124.342 159.915 53.2107 155.573 73.5827 145.554C90.9526 137.204 105.307 138.203 105.307 138.203V138.203ZM170.423 174.604C207.83 155.234 190.46 136.534 178.438 138.873C175.429 139.54 174.096 140.207 174.096 140.207C174.096 140.207 175.097 138.203 177.436 137.54C201.145 129.19 219.849 162.586 169.757 175.61C169.757 175.61 170.092 175.275 170.423 174.608V174.604ZM108.979 227.364C145.046 229.703 200.147 226.03 201.484 208.995C201.484 208.995 198.817 215.673 171.764 220.683C141.042 226.359 102.968 225.692 80.5957 222.016C80.5957 222.016 85.2698 226.023 108.982 227.36L108.979 227.364Z" />
        <path xmlns="http://www.w3.org/2000/svg" fill="#F58219" d="M147.685 28C147.685 28 168.389 49.0388 127.983 80.7594C95.5891 106.472 120.632 121.168 127.983 137.861C108.948 120.833 95.2609 105.802 104.606 91.7762C118.331 71.0828 156.062 61.0644 147.685 28ZM137 123.842C146.683 134.862 134.333 144.881 134.333 144.881C134.333 144.881 159.044 132.195 147.692 116.494C137.338 101.466 129.324 94.1184 172.738 69.0689C172.738 69.0689 104.278 86.0968 137.007 123.835L137 123.842Z" />
  </g>
</svg>